[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fungo"
version = "1.0.0"
description = "Python tools for baseball data from Statcast, the MLB Stats API, FanGraphs, and Baseball-Reference."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Josh Hejka" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["baseball", "statcast", "mlb", "sabermetrics", "data"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# beautifulsoup4: Baseball-Reference table parsing (comment-deferred tables).
# curl_cffi: browser TLS impersonation — B-R Cloudflare-fingerprint-blocks
# generic Python clients (as it did for months in 2025).
dependencies = ["beautifulsoup4", "curl_cffi"]

[project.urls]
Homepage = "https://github.com/hedgertronic/fungo"
Repository = "https://github.com/hedgertronic/fungo"

[project.scripts]
fungo = "fungo.cli:main"

[project.optional-dependencies]
# No DataFrame extra: fungo returns list[dict]/dict — wrap results in whatever
# frame library you already use (pl.DataFrame(rows) / pd.DataFrame(rows)).
progress = ["rich"]
all = ["rich"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "rich",
    "pre-commit",
    "types-beautifulsoup4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fungo"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.mypy]
files = ["src"]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
addopts = "-m 'not live'"
markers = ["live: hits real network (deselected by default)"]
